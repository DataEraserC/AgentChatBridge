[package]
name = "acb-example-tool"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "进程内 ToolProvider 最小示例"

[[bin]]
name = "minimal-tool-provider"
path = "src/main.rs"

[dependencies]
# 示例不是生产构建，显式启用测试 fixture 入口。
acb-kernel = { path = "../../crates/kernel", features = ["test-fixtures"] }
serde_json = "1"

# 故意不加入根 workspace：示例可以单独构建，不拖慢主仓库。
[workspace]
