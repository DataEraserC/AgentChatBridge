[package]
name = "acb-issue-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "独立 issue/workitem 服务：SQLite + HTTP API + process-tools provider"

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[lib]
name = "acb_issue_service"
path = "src/lib.rs"

[[bin]]
name = "acb-issue-service"
path = "src/main.rs"

[[bin]]
name = "acb-issue-tools"
path = "src/bin/acb-issue-tools.rs"
