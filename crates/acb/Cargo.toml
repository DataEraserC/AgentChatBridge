[package]
name = "acb"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ACB 运维 CLI：从模板渲染并安装 systemd unit"

[[bin]]
name = "acbctl"
path = "src/main.rs"

[dependencies]
acb-kernel = { path = "../kernel" }
acb-supervisor = { path = "../supervisor" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 测试 fixture 只在测试构建里可见；生产二进制不包含该入口。
acb-kernel = { path = "../kernel", features = ["test-fixtures"] }
