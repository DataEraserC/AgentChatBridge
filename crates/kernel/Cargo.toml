[package]
name = "acb-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "桥的核心：订阅、唤醒、流水、水位、笔记"

[dependencies]
acb-i18n = { workspace = true }
acb-proto = { path = "../proto" }
acb-adapter-api = { path = "../adapter-api" }
# 记忆仓库只用本地路径（裸仓库 + worktree），不需要 https/ssh 传输，关掉默认 feature
# 避免拉进 openssl/libssh2 那套 C 库。要远程传输时再开对应 feature。
git2 = { version = "0.19", default-features = false }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
ring = "0.17"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# 仅测试/示例使用：开启后才会编译 Config::parse_fixture / load_fixture。
# 生产构建不启用（release 下显式开启会直接编译失败），因此入口不存在。
test-fixtures = []

[dev-dependencies]
# 自引用让本 crate 的 unit/integration tests 与 examples 看到 test-fixtures；
# 正常 build 不包含 dev-dependencies，生产二进制里没有 fixture 入口。
acb-kernel = { path = ".", features = ["test-fixtures"] }
