[package]
name = "acb-wasm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
# wasmi 2.0 要求 Rust 1.86；只有打开 wasm-host feature 时才需要。
rust-version = "1.86"
description = "WASM 策略 provider 宿主进程：独立进程内跑 wasmi，stdio 行协议"

[features]
default = []
# 只有开启它才会编译 wasmi 和宿主二进制；默认构建的 core 完全不碰 wasm 运行时。
wasm-host = ["dep:wasmi"]
# 参考 .so 载体与双载体一致性测试；默认关闭，显式开启才构建 fixture。
native-so = [
    "wasm-host",
    "dep:acb-access-so-fixture",
    "dep:acb-access-so-bad-abi",
]

[lib]
name = "acb_wasm_host"
path = "src/lib.rs"

[[bin]]
name = "acb-wasm-host"
path = "src/main.rs"
required-features = ["wasm-host"]

[dependencies]
acb-adapter-api = { path = "../adapter-api" }
serde = { workspace = true }
serde_json = { workspace = true }
wasmi = { version = "2.0.0", optional = true }
acb-access-so-fixture = { path = "../fixtures/access-so", optional = true }
acb-access-so-bad-abi = { path = "../fixtures/access-so-bad-abi", optional = true }

[dev-dependencies]
acb-adapter-dynamic = { path = "../adapters/dynamic" }
acb-kernel = { path = "../kernel" }
acb-plugin-process-provider = { path = "../plugins/process-provider" }
