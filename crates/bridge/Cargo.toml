[package]
name = "acb-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "桥本体：读配置、连平台、等 harness"
# 这个 crate 有两个可执行文件，默认跑桥本体。
default-run = "acb-bridge"

[dependencies]
acb-i18n = { workspace = true }
acb-kernel = { path = "../kernel" }
acb-plugin-trusted = { path = "../plugins/trusted" }
acb-plugin-lua = { path = "../plugins/lua" }
acb-plugin-process-tools = { path = "../plugins/process-tools" }
acb-plugin-process-provider = { path = "../plugins/process-provider" }
acb-adapter-onebot-snowluma = { path = "../adapters/onebot-snowluma" }
acb-adapter-process = { path = "../adapters/process" }
acb-adapter-dynamic = { path = "../adapters/dynamic" }
acb-extensions = { path = "../extensions" }
acb-proto = { path = "../proto" }
acb-memory-steward = { path = "../memory-steward" }
serde_json = { workspace = true }
# SIGTERM / SIGHUP 处理。只做信号到原子量的转发，handler 里不碰任何非信号安全函数。
libc = "0.2"
# 配置补丁用：在原 TOML 文档上外科手术式改键，注释排版不丢（ADR-0009）。
# 版本跟 kernel 的 toml 0.8 同族（toml 0.8 内部就是它）。
toml_edit = "0.22"

[dev-dependencies]
# 测试 fixture 只在这条 dev-dependency 开启 feature 后可见；生产构建不包含 dev-dependencies。
acb-kernel = { path = "../kernel", features = ["test-fixtures"] }
