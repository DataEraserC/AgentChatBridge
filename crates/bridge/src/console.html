<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>acb-bridge console</title>
<style>
  /* ---------------------------------------------------------------------
     Design tokens：间距只用 4/8/12/16/24/32；字号只有标题/正文/辅助三档。
     颜色是中性灰阶 + 单一强调色；状态色只用于状态标记。
     --------------------------------------------------------------------- */
  :root {
    color-scheme: dark;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --space-8: 32px;
    --text-title: 16px;
    --text-body: 14px;
    --text-aux: 12px;
    --leading-title: 1.4;
    --leading-body: 1.5;
    --leading-aux: 1.5;
    --bg: #14161a;
    --surface: #1b1e24;
    --surface-raised: #22262e;
    --border: #2f343d;
    --border-strong: #3a414b;
    --text: #dfe3ea;
    --text-muted: #939aa6;
    --text-strong: #f1f3f7;
    --accent: #4f9cf9;
    --accent-weak: #1c2a3d;
    --ok: #5cc07f;
    --ok-weak: #1c2a22;
    --warn: #d9a03f;
    --warn-weak: #32280f;
    --err: #dd6b6b;
    --err-weak: #332020;
    --radius-sm: 6px;
    --radius: 8px;
    --control-h: 32px;
    --control-sm: 24px;
    --touch: 44px;
    --icon: 16px;
    --font-sans: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: var(--text-body)/var(--leading-body) var(--font-sans); }
  h1, h2, h3 { margin: 0; color: var(--text-strong); font-weight: 600; line-height: var(--leading-title); }
  h1 { font-size: var(--text-title); }
  h2 { font-size: var(--text-body); }
  code, pre { font-family: var(--font-mono); }

  header { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--surface); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
  header .spacer { flex: 1; }
  header select.locale-switch { width: auto; min-width: 96px; height: var(--control-h); font-size: var(--text-aux); }

  nav { display: flex; gap: var(--space-1); padding: 0 var(--space-4); background: var(--bg); border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav button { flex: 0 0 auto; padding: var(--space-2) var(--space-3); background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-muted); font: var(--text-body)/1 var(--font-sans); cursor: pointer; }
  nav button.active { color: var(--text-strong); border-bottom-color: var(--accent); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { max-width: 1120px; margin: 0 auto; padding: var(--space-4); }
  section { display: none; }
  section.active { display: block; }

  .card { padding: var(--space-4); margin-bottom: var(--space-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .card:last-child { margin-bottom: 0; }
  .card h2 { margin: 0 0 var(--space-3); }
  .card-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
  .card-head h2 { margin: 0; }
  .card-head .spacer { flex: 1; }

  .notice { padding: var(--space-2) var(--space-3); margin-bottom: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-size: var(--text-aux); line-height: var(--leading-aux); }

  .icon { width: var(--icon); height: var(--icon); flex: 0 0 auto; display: inline-block; vertical-align: middle; }
  .info { display: inline-flex; align-items: center; justify-content: center; width: var(--icon); height: var(--icon); padding: 0; background: none; border: 0; border-radius: 50%; color: var(--text-muted); cursor: pointer; }
  .info:hover, .info[aria-expanded="true"] { color: var(--accent); }
  .info:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn, .act, .mini { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border-radius: var(--radius-sm); font: var(--text-body)/1 var(--font-sans); white-space: nowrap; cursor: pointer; }
  .btn, .act { height: var(--control-h); padding: 0 var(--space-3); background: var(--accent); border: 1px solid var(--accent); color: #fff; }
  .btn.ghost, .act.ghost { background: none; border-color: var(--border); color: var(--text-muted); }
  .btn.sm, .mini { height: var(--control-sm); padding: 0 var(--space-2); background: none; border: 1px solid var(--border); color: var(--text-muted); font-size: var(--text-aux); }
  .mini { margin-left: var(--space-1); vertical-align: middle; }
  .mini.danger, .btn.danger, .act.danger { color: var(--err); }
  .btn.danger, .act.danger { background: var(--err); border-color: var(--err); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-3); }
  .stat-item { min-width: 0; }
  .stat-item .label { display: block; color: var(--text-muted); font-size: var(--text-aux); line-height: var(--leading-aux); }
  .stat-item .value { display: block; color: var(--text-strong); font-size: var(--text-title); line-height: var(--leading-title); font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  .banner { display: flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-3); border: 1px solid var(--warn); border-radius: var(--radius-sm); background: var(--warn-weak); color: var(--warn); font-size: var(--text-body); line-height: var(--leading-body); }
  .banner.err { border-color: var(--err); background: var(--err-weak); color: var(--err); }
  .banner.info { border-color: var(--border); background: var(--surface-raised); color: var(--text); }
  .banner .detail, .state .detail { display: block; color: var(--text-muted); font-size: var(--text-aux); line-height: var(--leading-aux); overflow-wrap: anywhere; }
  details.detail summary { cursor: pointer; color: var(--text-muted); font-size: var(--text-aux); line-height: var(--leading-aux); }
  details.detail span { display: block; margin-top: var(--space-1); color: var(--text-muted); font-size: var(--text-aux); line-height: var(--leading-aux); overflow-wrap: anywhere; }
  .banner button { margin-left: auto; }

  .state { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3); border: 1px dashed var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-size: var(--text-body); line-height: var(--leading-body); }
  .state.error { border-color: var(--err); color: var(--err); }
  .spinner { width: var(--icon); height: var(--icon); border: 1.5px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: var(--text-aux); line-height: var(--leading-aux); }
  th, td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { color: var(--text-muted); font-weight: 500; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.wrap { overflow-wrap: anywhere; }
  table.table-responsive { min-width: 720px; }

  .pill { display: inline-flex; align-items: center; gap: var(--space-1); height: var(--control-sm); padding: 0 var(--space-2); border-radius: 999px; font-size: var(--text-aux); line-height: 1; white-space: nowrap; }
  .pill.dep-up, .pill.resolved { background: var(--ok-weak); color: var(--ok); }
  .pill.dep-down, .pill.open { background: var(--err-weak); color: var(--err); }
  .pill.dep-unknown, .pill.wontfix, .pill.resident, .pill.unloaded { background: var(--surface-raised); color: var(--text-muted); }
  .pill.acked, .pill.pending { background: var(--warn-weak); color: var(--warn); }
  .pill.unloadable { background: var(--accent-weak); color: var(--accent); }

  .kv { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: var(--space-1) var(--space-3); font-size: var(--text-body); }
  .kv .k { color: var(--text-muted); font-size: var(--text-aux); line-height: var(--leading-aux); }
  .secret { color: var(--warn); letter-spacing: 2px; }
  .muted { color: var(--text-muted); }
  .err { color: var(--err); }
  .ok { color: var(--ok); }
  .empty { color: var(--text-muted); }
  .warn { color: var(--warn); }
  .hint { color: var(--text-muted); font-size: var(--text-aux); line-height: var(--leading-aux); }

  pre { margin: 0; padding: var(--space-3); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--text-aux); line-height: var(--leading-aux); overflow: auto; }

  input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); font: var(--text-body)/var(--leading-body) var(--font-sans); }
  input, select { height: var(--control-h); padding: 0 var(--space-2); }
  textarea { width: 100%; min-height: 120px; padding: var(--space-2); font-family: var(--font-mono); font-size: var(--text-aux); line-height: var(--leading-aux); resize: vertical; }
  #toml-text { min-height: 50vh; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input.invalid, select.invalid, textarea.invalid { border-color: var(--err); }
  .form-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
  .form-row > label:first-child { display: inline-flex; align-items: center; gap: var(--space-1); min-width: 160px; color: var(--text-muted); font-size: var(--text-aux); line-height: var(--leading-aux); }
  .form-row .control { flex: 1 1 200px; min-width: 0; }
  .form-row input[type="text"], .form-row select { flex: 1 1 200px; min-width: 0; width: auto; }
  .form-row input[type="checkbox"] { width: var(--space-4); height: var(--space-4); min-height: 0; }

  #modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-start; justify-content: center; padding: var(--space-8) var(--space-4); background: rgba(0, 0, 0, .55); overflow: auto; }
  #modal.open { display: flex; }
  #modal-box { width: min(640px, 100%); padding: var(--space-6); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: 0 24px 64px rgba(0, 0, 0, .45); }
  #modal-box h2 { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); }
  .modal-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
  .modal-head .spacer { flex: 1; }
  .modal-actions { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
  .form-error { margin: 0 0 var(--space-2); font-size: var(--text-aux); line-height: var(--leading-aux); }

  .tip { position: fixed; z-index: 80; display: none; max-width: min(320px, calc(100vw - var(--space-8))); padding: var(--space-2) var(--space-3); background: var(--surface-raised); color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); box-shadow: 0 8px 24px rgba(0, 0, 0, .35); font-size: var(--text-aux); line-height: var(--leading-aux); pointer-events: none; }
  .tip.open { display: block; }

  @media (max-width: 720px) {
    header { flex-wrap: wrap; padding: var(--space-2) var(--space-3); }
    header .spacer { display: none; }
    header .brand { flex: 1 1 auto; }
    nav { padding: 0 var(--space-3); }
    main { padding: var(--space-3); }
    .card { padding: var(--space-3); margin-bottom: var(--space-3); }
    .stat { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kv { grid-template-columns: 1fr; gap: var(--space-1); }
    .kv .k { margin-top: var(--space-2); }
    .form-row > label:first-child { flex: 1 1 100%; min-width: 0; }
    .form-row input[type="text"], .form-row select { flex: 1 1 100%; width: 100%; }
    #modal { padding: 0; }
    #modal-box { width: 100%; min-height: 100%; padding: var(--space-4); border-radius: 0; }
  }

  @media (pointer: coarse) {
    button, select, input, textarea, .info { min-height: var(--touch); }
    .info { min-width: var(--touch); }
    .mini, .btn.sm { min-height: var(--touch); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 data-i18n="console.ui.page.title">acb-bridge console</h1>
    <button type="button" class="info" data-tip-key="console.ui.header.tip" data-i18n-aria="console.ui.info.more" aria-label="More information">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6"/><path d="M12 7h.01"/></svg>
    </button>
  </div>
  <div class="spacer"></div>
  <select id="locale" class="locale-switch" data-i18n-aria="console.ui.locale.label" aria-label="Interface language">
    <option value="zh-CN" data-i18n="console.ui.locale.zh"></option>
    <option value="en" data-i18n="console.ui.locale.en"></option>
  </select>
  <button id="logout" class="btn ghost" data-i18n="console.ui.logout">Sign out</button>
</header>

<nav>
  <button data-tab="status" class="active" data-i18n="console.nav.status">Overview</button>
  <button data-tab="sessions" data-i18n="console.nav.sessions">Sessions</button>
  <button data-tab="feedback" data-i18n="console.nav.feedback">Feedback</button>
  <button data-tab="plugins" data-i18n="console.nav.plugins">Plugins</button>
  <button data-tab="policy" data-i18n="console.nav.policy">Access</button>
  <button data-tab="config" data-i18n="console.nav.config">Config</button>
</nav>

<main>
  <!-- status-scope:start -->
  <section id="tab-status" class="active">
    <div id="memory-warning"></div>
    <div class="card">
      <div class="card-head">
        <h2 data-i18n="console.ui.overview.title">Overview</h2>
        <button type="button" class="info" data-tip-key="console.ui.status.reloadTip" data-i18n-aria="console.ui.info.more" aria-label="More information">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6"/><path d="M12 7h.01"/></svg>
        </button>
      </div>
      <div class="stat" id="status"></div>
      <div id="status-note"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2 data-i18n="console.deps.title">Dependency health</h2>
        <button type="button" class="info" data-tip-key="console.deps.intro" data-i18n-aria="console.ui.info.more" aria-label="More information">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6"/><path d="M12 7h.01"/></svg>
        </button>
        <div class="spacer"></div>
        <button type="button" class="btn ghost sm" onclick="loadStatus()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5"/><path d="M4 4v6h6"/><path d="M4 13a8 8 0 0 0 14 5"/><path d="M20 20v-6h-6"/></svg>
          <span data-i18n="console.deps.refresh">Refresh</span>
        </button>
      </div>
      <div id="deps-note"></div>
      <div id="dependencies"></div>
    </div>
  </section>
  <!-- status-scope:end -->

  <section id="tab-sessions">
    <div class="notice" data-i18n="console.ui.pending.tab">This tab is not localized yet.</div>
    <div id="sessions"></div>
  </section>
  <section id="tab-feedback">
    <div class="notice" data-i18n="console.ui.pending.tab">This tab is not localized yet.</div>
    <div class="card"><h2 data-i18n="console.ui.feedback.title">Agent feedback</h2><div id="feedback"></div></div>
  </section>
  <section id="tab-plugins">
    <div class="notice" data-i18n="console.ui.pending.tab">This tab is not localized yet.</div>
    <div class="card">
      <h2><span data-i18n="console.plugins.title">Plugin lifecycle</span><button class="mini" onclick="loadPlugins()" style="float:right" data-i18n="console.plugins.refresh">Refresh</button></h2>
      <p class="muted" data-i18n="console.plugins.intro">Root catalog and hot-unload state.</p>
      <p class="err" id="plugins-error"></p>
      <div id="plugins"></div>
    </div>
  </section>
  <section id="tab-policy">
    <div id="policy"></div>
  </section>
  <section id="tab-config">
    <div class="notice" data-i18n="console.ui.pending.tab">This tab is not localized yet.</div>
    <div id="config"></div>
  </section>
</main>

<div id="modal" onclick="if(event.target===this)closeModal()"><div id="modal-box"></div></div>
<div id="tip" class="tip" role="presentation"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
// token 存 localStorage；包 try/catch——某些嵌入环境（沙箱 iframe）禁存储会直接抛异常。
// 就算 localStorage 用不了，服务端种的 HttpOnly cookie 也能保住登录。
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const pageLocale = new URLSearchParams(location.search).get("locale");
const token = (() => {
  const m = location.search.match(/[?&]token=([^&]*)/);
  if (m) { store.set("acb-console-token", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname); }
  return store.get("acb-console-token") || "";
})();
if (!token) { location.href = "/?login=1"; }

const ICONS = {
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 10v6"/><path d="M12 7h.01"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14-5"/><path d="M4 4v6h6"/><path d="M4 13a8 8 0 0 0 14 5"/><path d="M20 20v-6h-6"/>',
  alert: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  inbox: '<path d="M4 13h5l2 3h2l2-3h5"/><path d="M5 5h14l2 8v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5l2-8z"/>',
  check: '<path d="m5 12 4 4L19 6"/>',
  close: '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
};
function icon(name) {
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const secret = (v) => '<span class="secret">******</span>';

// ---------------------------------------------------------------------------
// i18n：locale 由用户显式选择并持久化；首次按浏览器语言猜一次。
// 每次请求都带 ?locale=（服务端优先）和 Accept-Language（服务端兜底）。
// ---------------------------------------------------------------------------
const LOCALE_KEY = "acb-console-locale";
const SUPPORTED = ["zh-CN", "en"];
function guessLocale() {
  if (SUPPORTED.includes(pageLocale)) {
    store.set(LOCALE_KEY, pageLocale);
    return pageLocale;
  }
  const saved = store.get(LOCALE_KEY);
  if (SUPPORTED.includes(saved)) return saved;
  const langs = navigator.languages || [navigator.language || ""];
  return langs.some((l) => String(l).toLowerCase().startsWith("zh")) ? "zh-CN" : "en";
}
let locale = guessLocale();
let messages = {};
const t = (key, params = {}) => String(messages[key] ?? key).replace(/\{(\w+)\}/g, (m, name) => params[name] ?? m);

function withLocale(path) {
  if (path.includes("locale=")) return path;
  return path + (path.includes("?") ? "&" : "?") + "locale=" + encodeURIComponent(locale);
}

async function api(path, options = {}) {
  const res = await fetch(withLocale(path), {
    ...options,
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json",
      "Accept-Language": locale,
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) { store.del("acb-console-token"); location.href = "/?login=1"; throw new Error("401"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(body.error || ("HTTP " + res.status));
    error.detail = body.detail || "";
    throw error;
  }
  return body;
}

function applyStaticTexts() {
  document.documentElement.lang = locale;
  document.title = t("console.ui.page.title");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  const switcher = $("#locale");
  if (switcher) switcher.value = locale;
}

async function loadI18n() {
  const reply = await api("/api/i18n?locale=" + encodeURIComponent(locale));
  if (reply.locale && SUPPORTED.includes(reply.locale)) locale = reply.locale;
  messages = reply.messages || {};
  applyStaticTexts();
}

// ---------------------------------------------------------------------------
// ⓘ：悬停/聚焦 tooltip，点按固定 popover。浮层用 position:fixed，
// 位置按视口钳制，不会被任何 overflow 容器裁切。
// ---------------------------------------------------------------------------
let tipOwner = null;
let tipPinned = false;

function tipText(el) {
  const key = el.dataset.tipKey;
  return key ? t(key) : (el.dataset.tip || "");
}

function positionTip(el) {
  const tip = $("#tip");
  const anchor = el.getBoundingClientRect();
  const box = tip.getBoundingClientRect();
  const gap = 8;
  const pad = 8;
  let left = anchor.left + anchor.width / 2 - box.width / 2;
  let top = anchor.bottom + gap;
  if (top + box.height > window.innerHeight - pad) top = anchor.top - gap - box.height;
  left = Math.max(pad, Math.min(left, window.innerWidth - box.width - pad));
  top = Math.max(pad, Math.min(top, window.innerHeight - box.height - pad));
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}

function showTip(el, pinned) {
  const text = tipText(el);
  if (!text) return;
  const tip = $("#tip");
  tip.textContent = text;
  tip.classList.add("open");
  tipOwner = el;
  tipPinned = pinned;
  el.setAttribute("aria-expanded", "true");
  positionTip(el);
}

function hideTip(force) {
  if (tipPinned && !force) return;
  const tip = $("#tip");
  tip.classList.remove("open");
  if (tipOwner) tipOwner.setAttribute("aria-expanded", "false");
  tipOwner = null;
  tipPinned = false;
}

document.addEventListener("mouseover", (e) => {
  const el = e.target.closest && e.target.closest(".info");
  if (el && !tipPinned) showTip(el, false);
});
document.addEventListener("mouseout", (e) => {
  const el = e.target.closest && e.target.closest(".info");
  if (el && !tipPinned && tipOwner === el) hideTip(true);
});
document.addEventListener("focusin", (e) => {
  const el = e.target.closest && e.target.closest(".info");
  if (el && !tipPinned) showTip(el, false);
});
document.addEventListener("focusout", () => { if (!tipPinned) hideTip(true); });
document.addEventListener("click", (e) => {
  const el = e.target.closest && e.target.closest(".info");
  if (el) {
    e.preventDefault();
    if (tipOwner === el && tipPinned) hideTip(true);
    else showTip(el, true);
  } else if (tipPinned) {
    hideTip(true);
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && tipPinned) hideTip(true); });
window.addEventListener("scroll", () => { if (tipOwner) positionTip(tipOwner); }, true);
window.addEventListener("resize", () => { if (tipOwner) positionTip(tipOwner); });

/**
 * 记忆管家长期未同步告警。status.json 里 stuck=true 的目标在概览顶部显示，
 * 避免 agent 忘了提交导致记忆永久不同步却没人发现。
 */
function renderMemoryWarning(memory) {
  const box = $("#memory-warning");
  if (!box) return;
  if (!memory || memory.enabled === false || !memory.targets) {
    if (memory && memory.error) {
      box.innerHTML = `<div class="banner err">${icon("alert")}<div><span>${esc(memory.error)}</span>${detailBlock(memory.detail)}</div></div>`;
    } else {
      box.innerHTML = "";
    }
    return;
  }
  const stuck = Object.entries(memory.targets).filter(([, state]) => state && state.stuck);
  if (stuck.length === 0) {
    box.innerHTML = "";
    return;
  }
  box.innerHTML = stuck.map(([key, state]) => {
    const skips = state.consecutive_skips ?? 0;
    const last = state.last_result || t("console.ui.common.unknown");
    return `<div class="banner err">${icon("alert")}<div><span>${esc(t("console.ui.memory.stuck", { key }))}</span> <span class="muted">${esc(t("console.ui.memory.detail", { skips, last }))}</span>${detailBlock(state.error)}</div></div>`;
  }).join("");
}

let depsCache = null;
let depsCacheAt = 0;

function depStateClass(state) {
  if (state === "up") return "dep-up";
  if (state === "down") return "dep-down";
  return "dep-unknown";
}

function depLabel(prefix, value) {
  const key = prefix + value;
  const text = t(key);
  return text === key ? value : text;
}

function depTime(ms) {
  return ms ? new Date(ms).toLocaleString(locale) : t("console.deps.never");
}

function depBool(value) {
  return value ? t("console.deps.yes") : t("console.deps.no");
}

function depAccount(dep) {
  if (dep.accountOnline === true) return t("console.deps.account.online");
  if (dep.accountOnline === false) return t("console.deps.account.offline");
  return t("console.deps.account.unknown");
}

function depVersion(dep) {
  const v = dep.version;
  if (!v) return "";
  const protocol = v.protocol || {};
  const impl = v.impl || {};
  const adapter = v.adapter || {};
  const compat = (adapter.compat || {}).state || "";
  const unknown = t("console.ui.common.unknown");
  return [
    protocol.version,
    `${impl.name || unknown} ${impl.version || unknown}`,
    `adapter ${adapter.version || unknown}`,
    compat,
  ].filter(Boolean).join(" · ");
}

function renderDependencies(data, stale, error, detail) {
  const box = $("#dependencies");
  const note = $("#deps-note");
  if (!box || !note) return;
  const items = (data && data.dependencies) || [];
  if (stale) {
    note.className = "";
    note.innerHTML = `<div class="banner err">${icon("alert")}<div><span>${esc(t("console.deps.stale", { time: depsCacheAt ? new Date(depsCacheAt).toLocaleString(locale) : t("console.deps.never") }))}</span>${detailBlock(detail)}</div></div>`;
  } else {
    note.innerHTML = "";
  }
  if (!items.length) {
    box.innerHTML = emptyBox("console.deps.empty");
    return;
  }
  const label = (key) => esc(t(key));
  const rows = items.map((dep) => {
    const err = dep.lastError || "";
    const cls = dep.lastErrorClass || "";
    const classKey = "console.deps.errorClass." + cls;
    const classText = cls ? t(classKey) : "";
    const classLabel = classText && classText !== classKey ? classText : t("console.deps.errorClass.unknown");
    const errorCell = (err || cls)
      ? `<td class="wrap" data-label="${label("console.deps.col.lastError")}">${esc(classLabel)}${detailBlock(err)}</td>`
      : `<td class="muted" data-label="${label("console.deps.col.lastError")}">${esc(t("console.deps.none"))}</td>`;
    return `<tr>
      <td class="wrap" data-label="${label("console.deps.col.id")}"><code>${esc(dep.id)}</code>${dep.version ? `<br><span class="muted">${esc(depVersion(dep))}</span>` : ""}</td>
      <td data-label="${label("console.deps.col.kind")}">${esc(depLabel("console.deps.kind.", dep.kind))}</td>
      <td data-label="${label("console.deps.col.state")}"><span class="pill ${depStateClass(dep.state)}">${esc(depLabel("console.deps.state.", dep.state))}</span></td>
      <td data-label="${label("console.deps.col.account")}">${esc(depAccount(dep))}</td>
      <td data-label="${label("console.deps.col.since")}">${esc(depTime(dep.since))}</td>
      <td data-label="${label("console.deps.col.lastOkAt")}">${esc(dep.lastOkAt ? depTime(dep.lastOkAt) : t("console.deps.never"))}</td>
      <td class="num" data-label="${label("console.deps.col.attempts")}">${esc(dep.attempts ?? 0)}</td>
      ${errorCell}
      <td data-label="${label("console.deps.col.scope")}">${esc(depBool(dep.configured))} / ${esc(depBool(dep.expected))}</td>
    </tr>`;
  }).join("");
  box.innerHTML = `<div class="table-wrap"><table class="table-responsive">
    <thead><tr><th>${label("console.deps.col.id")}</th><th>${label("console.deps.col.kind")}</th>
    <th>${label("console.deps.col.state")}</th><th>${label("console.deps.col.account")}</th><th>${label("console.deps.col.since")}</th>
    <th>${label("console.deps.col.lastOkAt")}</th><th class="num">${label("console.deps.col.attempts")}</th>
    <th>${label("console.deps.col.lastError")}</th><th>${label("console.deps.col.scope")}</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

async function loadDependencies() {
  const box = $("#dependencies");
  const note = $("#deps-note");
  if (box) box.innerHTML = loadingBox();
  if (note) note.innerHTML = "";
  try {
    const data = await api("/api/dependencies");
    depsCache = data;
    depsCacheAt = Date.now();
    renderDependencies(data, false, "");
  } catch (e) {
    if (depsCache) {
      renderDependencies(depsCache, true, e.message, e.detail || "");
    } else if (box) {
      box.innerHTML = errorBox(e, "console.deps.error");
    }
  }
}

async function interruptSession(id) {
  if (!confirm("打断会话 " + id + " 正在跑的这一轮？dsh 侧会被取消（aborted），桥按失败发通知。")) return;
  const note = $("#reset-note-" + id);
  try {
    const r = await api("/api/session/" + encodeURIComponent(id) + "/interrupt", { method: "POST", body: "{}" });
    note.textContent = "✓ " + (r.note || "interrupt 指令已发出");
    setTimeout(loadSessions, 1500);
  } catch (e) { note.innerHTML = '<span class="err">' + esc(e.message) + "</span>"; }
}

async function resetSession(id) {
  if (!confirm("确定重置会话 " + id + " ？harness 侧会收到 reset，桥侧映射断开。")) return;
  const note = $("#reset-note-" + id);
  try {
    const r = await api("/api/session/" + encodeURIComponent(id) + "/reset", { method: "POST", body: "{}" });
    note.textContent = "✓ " + (r.note || "reset 指令已发出");
    setTimeout(loadSessions, 1500);
  } catch (e) { note.innerHTML = '<span class="err">' + esc(e.message) + "</span>"; }
}

const pluginStateClass = (state) => (state === "pending_unload" || state === "pending_reload" ? "pending" : state);

function pluginHealth(health) {
  if (!health || health.state === "healthy") return t("console.plugins.healthHealthy");
  const detail = health.detail || "";
  return health.state === "degraded"
    ? t("console.plugins.healthDegraded", { detail })
    : t("console.plugins.healthUnhealthy", { detail });
}

function pluginActions(p) {
  if (p.pending) return `<span class="muted">${esc(t("console.plugins.pendingHint"))}</span>`;
  if ((p.refs || []).length) return `<span class="muted">${esc(t("console.plugins.referencedHint"))}</span>`;
  if (p.state === "unloadable") {
    return `<button class="act" onclick="pluginAction('${esc(p.id)}','reload','unloadable')">${esc(t("console.plugins.reload"))}</button>
      <button class="act danger" onclick="pluginAction('${esc(p.id)}','unload','unloadable')">${esc(t("console.plugins.unload"))}</button>`;
  }
  if (p.state === "unloaded") {
    return `<button class="act" onclick="pluginAction('${esc(p.id)}','reload','unloaded')">${esc(t("console.plugins.load"))}</button>`;
  }
  return `<span class="muted">${esc(t("console.plugins.residentHint"))}</span>`;
}

async function loadPlugins() {
  const box = $("#plugins");
  const error = $("#plugins-error");
  error.className = "err";
  error.textContent = "";
  box.innerHTML = loadingBox();
  try {
    const { plugins } = await api("/api/plugins");
    if (!plugins.length) {
      box.innerHTML = emptyBox("console.plugins.empty");
      return;
    }
    const rows = plugins.map((p) => {
      const meta = p.metadata || {};
      const summary = meta.summary || meta.title || t("console.plugins.summaryMissing");
      const refs = (p.refs || []).length ? p.refs.map(esc).join("<br>") : esc(t("console.plugins.none"));
      const lastError = p.lastError
        ? `<br><span class="err">${esc(t("console.plugins.lastError", { error: p.lastError }))}</span>`
        : "";
      return `<tr>
        <td class="wrap"><code>${esc(p.id)}</code><br><span class="muted">${esc(summary)}</span>${lastError}</td>
        <td>${esc(p.extension)}</td>
        <td>${esc(p.source)}${p.kind ? '<br><span class="muted">kind: ' + esc(p.kind) + "</span>" : ""}</td>
        <td><span class="pill ${esc(pluginStateClass(p.state))}">${esc(t("console.plugins.state." + p.state))}</span></td>
        <td class="wrap">${refs}</td>
        <td>${esc(pluginHealth(p.health))}</td>
        <td>${pluginActions(p)}</td>
      </tr>`;
    }).join("");
    box.innerHTML = `<div class="table-wrap"><table class="table-responsive">
      <thead><tr><th>${esc(t("console.plugins.col.id"))}</th><th>${esc(t("console.plugins.col.extension"))}</th>
      <th>${esc(t("console.plugins.col.source"))}</th><th>${esc(t("console.plugins.col.state"))}</th>
      <th>${esc(t("console.plugins.col.refs"))}</th><th>${esc(t("console.plugins.col.health"))}</th>
      <th>${esc(t("console.plugins.col.actions"))}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } catch (e) {
    box.innerHTML = "";
    error.textContent = t("console.plugins.actionFailed", { error: e.message });
  }
}

async function pluginAction(id, action, state) {
  const confirmKey = action === "unload"
    ? "console.plugins.confirmUnload"
    : (state === "unloaded" ? "console.plugins.confirmLoad" : "console.plugins.confirmReload");
  if (!confirm(t(confirmKey, { id }))) return;
  const error = $("#plugins-error");
  error.textContent = "";
  try {
    const reply = await api("/api/plugins/" + action, { method: "POST", body: JSON.stringify({ id }) });
    await loadPlugins();
    if (!error.textContent) {
      error.className = "ok";
      error.textContent = t("console.plugins.queued", { note: reply.note || "" });
    }
  } catch (e) {
    error.className = "err";
    error.textContent = t("console.plugins.actionFailed", { error: e.message });
  }
}

function wakeText(w) {
  if (!w) return "—";
  const parts = [];
  if (w.at_mention) parts.push("@我");
  if (w.reply) parts.push("引用我");
  if (w.name_mention && (w.names || []).length) parts.push("叫名字(" + w.names.join("/") + ")");
  if (w.poke) parts.push("拍我");
  if (w.accumulate) parts.push("攒" + w.accumulate + "条");
  if ((w.event_tags || []).length) parts.push("标签:" + w.event_tags.join("/"));
  if ((w.events || []).length) parts.push("事件:" + w.events.join("/"));
  if ((w.keywords || []).length) parts.push("关键词:" + w.keywords.join("/"));
  if ((w.ignore_speakers || []).length) parts.push("无视:" + w.ignore_speakers.join("/"));
  return parts.join("，") || "（全关）";
}

let policyCache = null;

// 当前策略的深拷贝。表单改一个字段后整份提交——后端一次事务写到底，
// 不会出现「规则改了一半」的中间态。
function policyDraft() {
  return JSON.parse(JSON.stringify((policyCache && policyCache.grants) || {}));
}

async function savePolicy(next) {
  try {
    await api("/api/policy", { method: "POST", body: JSON.stringify({ grants: next }) });
    await loadPolicy();
    return true;
  } catch (e) {
    reportError(e.message);
    return false;
  }
}

async function loadPolicy() {
  const r = await api("/api/policy");
  policyCache = r;
  const g = r.grants || {};
  const rooms = Object.entries(g.rooms || {});
  const accounts = Object.entries(g.accounts || {});
  const rules = (g.rules || []).map((x) => ({ ...x, effect: "allow" }))
    .concat((g.deny || []).map((x) => ({ ...x, effect: "deny" })));

  const routeText = (v) => (v && v.length)
    ? v.map(esc).join("<br>")
    : '<span class="muted">（回退账号级 → 适配器私聊）</span>';
  const listText = (v) => (v && v.length) ? v.map(esc).join("<br>") : '<span class="muted">—</span>';

  const roomRows = rooms.map(([room, grant]) => `<tr>
    <td class="wrap">${esc(room)}</td>
    <td>${esc(grant.trust || "untrusted")}</td>
    <td class="wrap">${listText(grant.members)}</td>
    <td class="wrap">${routeText(grant.approval_route)}</td>
    <td><button class="mini" onclick="editRoomPolicy('${esc(room)}')">编辑</button><button class="mini danger" onclick="delRoomPolicy('${esc(room)}')">删</button></td>
  </tr>`).join("");

  const accountRows = accounts.map(([key, grant]) => `<tr>
    <td>${esc(key)}</td><td class="wrap">${routeText(grant.approval_route)}</td>
    <td><button class="mini" onclick="editAccountRoute('${esc(key)}')">编辑</button><button class="mini danger" onclick="delAccountRoute('${esc(key)}')">删</button></td>
  </tr>`).join("");

  const ruleRows = rules.map((rule) => `<tr>
    <td>${rule.effect === "deny" ? '<span class="err">deny</span>' : "allow"}</td>
    <td>${esc(rule.id)}</td>
    <td>${esc(rule.subject)}</td><td>${esc(rule.place)}</td><td>${esc(rule.scope)}</td>
    <td class="wrap">${(rule.capability || []).map(esc).join(", ")}</td>
    <td><button class="mini" onclick="editRule('${rule.effect}','${esc(rule.id)}')">编辑</button><button class="mini danger" onclick="delRule('${rule.effect}','${esc(rule.id)}')">删</button></td>
  </tr>`).join("");

  const pending = r.pending_reload
    ? `<div class="banner">${icon("alert")}<span>改动已入库，下一次开轮生效（一轮之内看到的策略不变）。</span></div>`
    : "";
  const raw = (v, empty) => v ? `<code class="wrap">${esc(JSON.stringify(v))}</code>` : `<span class="muted">${empty}</span>`;

  $("#policy").innerHTML = `${pending}
  <div class="card"><h2>房间政策与审批路由<button class="mini" onclick="addRoomPolicy()" style="float:right">+ 新房间</button></h2>
    <p class="muted">审批路由决定申请票据递给谁。<b>没配的房间会回退到账号级，再回退到适配器私聊</b>——那个房间没人订阅，票据会一路 pending 到过期，而且事后补配置救不回来（路由是建票时的快照）。</p>
    <p class="muted">权威来源：<b>${esc(r.source === "database" ? "数据库（config.toml 的 [grants] 已不再生效）" : r.source)}</b></p>
    <div class="table-wrap"><table class="table-responsive">
      <thead><tr><th>房间</th><th>信任</th><th>可信成员</th><th>审批路由</th><th></th></tr></thead>
      <tbody>${roomRows || '<tr><td colspan="5" class="muted">还没有房间政策</td></tr>'}</tbody></table></div></div>

  <div class="card"><h2>账号级审批路由<button class="mini" onclick="addAccountRoute()" style="float:right">+ 新账号</button></h2>
    <p class="muted">键形如 <code>qq:10001</code>（连接:账号）。房间没配时用它。</p>
    <div class="table-wrap"><table class="table-responsive">
      <thead><tr><th>账号</th><th>审批路由</th><th></th></tr></thead>
      <tbody>${accountRows || '<tr><td colspan="3" class="muted">无</td></tr>'}</tbody></table></div></div>

  <div class="card"><h2>管理员</h2><div class="kv">
    <div class="k">bot_admin</div><div class="wrap">${raw(g.bot_admin && g.bot_admin.accounts, "未配置")}</div>
    <div class="k">system_admin</div><div class="wrap">${raw(g.system_admin, "未配置")}</div></div>
    <p><button class="mini" onclick="editAdmins()">编辑管理员</button></p></div>

  <div class="card"><h2>授权规则<button class="mini" onclick="addRule('allow')" style="float:right">+ allow 规则</button></h2>
    <p class="muted">deny 只做减法，和 allow 的顺序无关；命中 deny 一律拒绝。能力清单与主体/场所的取值见文档。</p>
    <div class="table-wrap"><table class="table-responsive">
      <thead><tr><th>效果</th><th>id</th><th>主体</th><th>场所</th><th>范围</th><th>能力</th><th></th></tr></thead>
      <tbody>${ruleRows || '<tr><td colspan="7" class="muted">无</td></tr>'}</tbody></table></div>
    <p><button class="mini" onclick="addRule('deny')">+ deny 规则</button></p></div>`;
}

function editRoomPolicy(room) {
  const current = (policyCache?.grants?.rooms || {})[room] || {};
  formFrame(`房间政策：${esc(room)}`, `
    <div class="form-row"><label>信任</label><select id="pr-trust">
      <option value="untrusted">untrusted（默认）</option>
      <option value="trusted">trusted（可信）</option></select>
      <span class="hint">只影响「按 trust 生效」的判断；成员名单非空时以名单为准</span></div>
    <div class="form-row"><label>可信成员</label><input type="text" id="pr-members" placeholder="逗号分隔；留空 = 按 trust 生效" style="max-width:420px"></div>
    <div class="form-row"><label>审批路由</label><input type="text" id="pr-route" placeholder="qq:group/498587179, qq:private/323622442" style="max-width:420px">
      <span class="hint">票据申请递到这里。群内批准要带消息里的 nonce；留空 = 回退账号级 → 适配器私聊（通常没人看）</span></div>`,
    async () => {
      const next = policyDraft();
      next.rooms = next.rooms || {};
      next.rooms[room] = {
        trust: document.getElementById("pr-trust").value,
        members: csv(document.getElementById("pr-members").value),
        approval_route: csv(document.getElementById("pr-route").value),
      };
      return savePolicy(next);
    });
  document.getElementById("pr-trust").value = current.trust || "untrusted";
  document.getElementById("pr-members").value = (current.members || []).join(", ");
  document.getElementById("pr-route").value = (current.approval_route || []).join(", ");
}

function addRoomPolicy() {
  const room = prompt("房间键（形如 qq:group/769843907）：");
  if (!room) return;
  const next = policyDraft();
  next.rooms = next.rooms || {};
  if (next.rooms[room.trim()]) { alert("这个房间已经有政策了，直接编辑它。"); return; }
  next.rooms[room.trim()] = { trust: "untrusted", members: [], approval_route: [] };
  savePolicy(next).then((ok) => { if (ok) editRoomPolicy(room.trim()); });
}

async function delRoomPolicy(room) {
  if (!confirm(`删除房间政策「${room}」？\n删掉后这个房间就没有审批路由了，票据会回退到账号级/适配器私聊。`)) return;
  const next = policyDraft();
  delete (next.rooms || {})[room];
  await savePolicy(next);
}

function editAccountRoute(key) {
  const current = (policyCache?.grants?.accounts || {})[key] || {};
  formFrame(`账号审批路由：${esc(key)}`, `
    <div class="form-row"><label>审批路由</label><input type="text" id="pa-route" placeholder="qq:private/323622442" style="max-width:420px">
      <span class="hint">这个账号下所有房间的兜底审批地点</span></div>`,
    async () => {
      const next = policyDraft();
      next.accounts = next.accounts || {};
      next.accounts[key] = { approval_route: csv(document.getElementById("pa-route").value) };
      return savePolicy(next);
    });
  document.getElementById("pa-route").value = (current.approval_route || []).join(", ");
}

function addAccountRoute() {
  const key = prompt("账号键（形如 qq:10001）：");
  if (!key) return;
  const next = policyDraft();
  next.accounts = next.accounts || {};
  next.accounts[key.trim()] = { approval_route: [] };
  savePolicy(next).then((ok) => { if (ok) editAccountRoute(key.trim()); });
}

async function delAccountRoute(key) {
  if (!confirm(`删除账号审批路由「${key}」？`)) return;
  const next = policyDraft();
  delete (next.accounts || {})[key];
  await savePolicy(next);
}

function editAdmins() {
  const bot = ((policyCache?.grants?.bot_admin || {}).accounts || [])
    .map((a) => `${a.connection}:${a.account}`).join(", ");
  const sys = policyCache?.grants?.system_admin;
  const sysText = sys ? `${sys.connection}:${sys.account}` : "";
  formFrame("管理员", `
    <div class="form-row"><label>bot_admin</label><input type="text" id="pad-bot" placeholder="qq:10001, qq:10002" style="max-width:420px">
      <span class="hint">逗号分隔；留空 = 没有 bot 管理员</span></div>
    <div class="form-row"><label>system_admin</label><input type="text" id="pad-sys" placeholder="qq:10001（只能一个）" style="max-width:420px">
      <span class="hint">最高权限持有者；留空 = 不设</span></div>`,
    async () => {
      const next = policyDraft();
      const botList = csv(document.getElementById("pad-bot").value).map((item) => {
        const [connection, account] = item.split(":");
        return { connection, account };
      }).filter((a) => a.connection && a.account);
      const sysOne = csv(document.getElementById("pad-sys").value)[0];
      if (botList.length) next.bot_admin = { accounts: botList };
      else delete next.bot_admin;
      if (sysOne) {
        const [connection, account] = sysOne.split(":");
        if (!connection || !account) { showFormError("system_admin 要写成 连接:账号"); return false; }
        next.system_admin = { connection, account };
      } else delete next.system_admin;
      return savePolicy(next);
    });
  document.getElementById("pad-bot").value = bot;
  document.getElementById("pad-sys").value = sysText;
}

const RULE_SUBJECTS = [["system", "system"], ["system_admin", "system_admin"], ["bot_admin", "bot_admin"], ["user", "user"]];
const RULE_PLACES = [["private", "private（私信）"], ["group", "group（群）"], ["console", "console"], ["none", "none"]];
const RULE_SCOPES = [["subscribed", "subscribed"], ["room", "room"], ["connection", "connection"], ["platform_op", "platform_op"]];
const RULE_CAPS = ["room_read", "room_write", "connection_read", "platform", "destructive", "critical", "account_read", "account_secret", "access_request", "plugin"];
const selectOf = (id, pairs, value) => `<select id="${id}">${pairs.map(([v, label]) =>
  `<option value="${esc(v)}"${v === value ? " selected" : ""}>${esc(label)}</option>`).join("")}</select>`;

function editRule(effect, id) {
  const list = (policyCache?.grants?.[effect === "deny" ? "deny" : "rules"] || []);
  const current = list.find((r) => r.id === id) || {
    id: "", subject: "user", place: "group", scope: "subscribed", capability: [],
  };
  const target = current.target || {};
  formFrame(`${effect === "deny" ? "拒绝" : "允许"}规则：${esc(id)}`, `
    <div class="form-row"><label>规则 id</label><input type="text" id="ru-id" value="${esc(current.id)}" style="max-width:260px">
      <span class="hint">稳定标识，审计里靠它追溯；改 id 等于新建一条</span></div>
    <div class="form-row"><label>主体</label>${selectOf("ru-subject", RULE_SUBJECTS, current.subject)}</div>
    <div class="form-row"><label>场所</label>${selectOf("ru-place", RULE_PLACES, current.place)}</div>
    <div class="form-row"><label>范围</label>${selectOf("ru-scope", RULE_SCOPES, current.scope)}</div>
    <div class="form-row"><label>目标</label><input type="text" id="ru-target-id" value="${esc(target.id || "")}" placeholder="room / connection / platform_op 的具体标识" style="max-width:340px">
      <span class="hint">scope = subscribed 时留空；target 的 kind 跟着 scope 走</span></div>
    <div class="form-row"><label>能力</label><input type="text" id="ru-caps" value="${esc((current.capability || []).join(", "))}" placeholder="room_read, room_write" style="max-width:420px">
      <span class="hint">可选：${RULE_CAPS.join(" / ")}</span></div>`,
    async () => {
      const newId = document.getElementById("ru-id").value.trim();
      if (!newId) { showFormError("规则 id 不能为空"); return false; }
      const caps = csv(document.getElementById("ru-caps").value);
      if (!caps.length) { showFormError("至少要选一项能力"); return false; }
      const bad = caps.filter((c) => !RULE_CAPS.includes(c));
      if (bad.length) { showFormError("不认识的能力：" + bad.join(", ")); return false; }
      const scope = document.getElementById("ru-scope").value;
      const targetId = document.getElementById("ru-target-id").value.trim();
      const rule = {
        id: newId,
        subject: document.getElementById("ru-subject").value,
        place: document.getElementById("ru-place").value,
        scope,
        capability: caps,
      };
      if (targetId) {
        const kind = scope === "connection" ? "connection"
          : scope === "platform_op" ? "platform_op" : "room";
        rule.target = { kind, id: targetId };
      }
      const next = policyDraft();
      const field = effect === "deny" ? "deny" : "rules";
      next[field] = next[field] || [];
      next[field] = next[field].filter((r) => r.id !== id);
      next[field].push(rule);
      return savePolicy(next);
    });
}

function addRule(effect) {
  const next = policyDraft();
  const field = effect === "deny" ? "deny" : "rules";
  const list = next[field] || [];
  let n = list.length + 1;
  while (list.some((r) => r.id === `rule-${n}`)) n += 1;
  const id = `rule-${n}`;
  list.push({ id, subject: "user", place: "group", scope: "subscribed", capability: ["room_read"] });
  next[field] = list;
  savePolicy(next).then((ok) => { if (ok) editRule(effect, id); });
}

async function delRule(effect, id) {
  if (!confirm(`删除规则「${id}」？\n删掉一条 allow 可能让人立刻失去权限。`)) return;
  const next = policyDraft();
  const field = effect === "deny" ? "deny" : "rules";
  next[field] = (next[field] || []).filter((r) => r.id !== id);
  await savePolicy(next);
}

async function editToml() {
  try {
    const r = await api("/api/config/toml");
    tomlEditorText = r.text;
    tomlResult = null;
    loadConfig();
  } catch (e) { alert(e.message); }
}

function cancelToml() {
  tomlEditorText = null;
  tomlResult = null;
  loadConfig();
}

async function saveToml() {
  const text = $("#toml-text").value;
  try {
    const r = await api("/api/config/toml", { method: "POST", body: JSON.stringify({ text }) });
    tomlResult = r;
    tomlEditorText = null;
    loadConfig();
  } catch (e) {
    tomlResult = { error: e.message };
    const box = $("#toml-result");
    if (box) box.innerHTML = '<p class="err">' + esc(e.message) + "</p>";
  }
}

async function discardStaged() {
  if (!confirm("放弃暂存的新配置？继续用当前生效的这份。")) return;
  try { await api("/api/config/discard", { method: "POST", body: "{}" }); loadConfig(); }
  catch (e) { alert(e.message); }
}

function renderTomlResult() {
  if (!tomlResult) return "";
  if (tomlResult.error) return '<p class="err">' + esc(tomlResult.error) + "</p>";
  const list = (items, cls) => (items || []).map((i) => `<li class="${cls}">${esc(i)}</li>`).join("");
  return `<div class="result">
    <p>${icon("check")} ${esc(tomlResult.note || "已保存")}</p>
    ${(tomlResult.changes || []).length ? "<p><b>本次改动：</b></p><ul>" + list(tomlResult.changes, "") + "</ul>" : ""}
    ${(tomlResult.hot_reload || []).length ? "<p><b>下一轮自动生效：</b></p><ul>" + list(tomlResult.hot_reload, "") + "</ul>" : ""}
    ${(tomlResult.needs_restart || []).length ? "<p class='err'><b>要重启桥才生效：</b></p><ul>" + list(tomlResult.needs_restart, "err") + "</ul>" : ""}
    ${!(tomlResult.hot_reload || []).length && !(tomlResult.needs_restart || []).length ? '<p class="muted">配置没变化（或变化不影响行为）。</p>' : ""}
  </div>`;
}

const tabs = {
  status: loadStatus,
  sessions: loadSessions,
  feedback: loadFeedback,
  plugins: loadPlugins,
  policy: loadPolicy,
  config: loadConfig,
};

const csv = (v) => String(v ?? "").split(/[,，]/).map((x) => x.trim()).filter(Boolean);
const findSession = (id) => (cfgCache?.sessions || []).find((s) => s.id === id);
const findPersona = (id) => (cfgCache?.personas || []).find((p) => p.id === id);
const findMemory = (id) => (cfgCache?.memories || []).find((m) => m.id === id);
const findConnection = (id) => (cfgCache?.connections || []).find((c) => c.id === id);

function showFormError(message) {
  const box = $("#form-error");
  if (!box) return false;
  box.hidden = false;
  box.textContent = message;
  return true;
}

function clearFormError() {
  const box = $("#form-error");
  if (!box) return;
  box.hidden = true;
  box.textContent = "";
}

function reportError(message) {
  if (!showFormError(message)) alert(message);
  const box = $("#toml-result");
  if (box) box.innerHTML = '<p class="err">' + esc(message) + "</p>";
}

async function submitPatch(ops) {
  try {
    const r = await api("/api/config/patch", { method: "POST", body: JSON.stringify({ ops }) });
    tomlResult = r;
    loadConfig();
    return true;
  } catch (e) {
    tomlResult = { error: e.message };
    reportError(e.message);
    return false;
  }
}

async function delEntry(section, id) {
  if (!confirm(`确定删除 ${section}「${id}」？\n保存后按轮次边界热生效；配置文件同目录会留 .bak 备份。`)) return;
  await submitPatch([{ op: "delete", section, id }]);
}

function closeModal() {
  $("#modal").classList.remove("open");
}

function formFrame(titleHtml, bodyHtml, onSave) {
  $("#modal-box").innerHTML = `<div class="modal-head"><h2>${titleHtml}</h2><div class="spacer"></div>
    <button type="button" class="info" onclick="closeModal()" aria-label="${esc(t("console.ui.close"))}">${icon("close")}</button></div>
    <p class="form-error err" id="form-error" hidden></p>${bodyHtml}
    <div class="modal-actions"><button class="act" id="form-save">${esc(t("console.ui.form.save"))}</button>
    <button class="act ghost" onclick="closeModal()">${esc(t("console.ui.form.cancel"))}</button></div>`;
  $("#modal").classList.add("open");
  $("#form-save").addEventListener("click", async () => {
    clearFormError();
    try {
      const result = await onSave();
      if (result !== false) closeModal();
    } catch (e) { reportError(e.message); }
  });
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

const wakeFormHtml = (w) => `
  <div class="form-row"><label>@ 我</label><input type="checkbox" id="w-at" ${w?.at_mention ? "checked" : ""}><span class="hint">群里有人 @ 本账号</span></div>
  <div class="form-row"><label>引用我</label><input type="checkbox" id="w-reply" ${w?.reply ? "checked" : ""}></div>
  <div class="form-row"><label>叫名字</label><input type="checkbox" id="w-nm" ${w?.name_mention ? "checked" : ""}>
    <input type="text" id="w-names" placeholder="名字列表，逗号分隔" value="${esc((w?.names || []).join(", "))}"></div>
  <div class="form-row"><label>攒条数</label><input type="text" id="w-acc" placeholder="不按条数就留空" value="${w?.accumulate ?? ""}" style="max-width:96px"></div>
  <div class="form-row"><label>被拍醒</label><input type="checkbox" id="w-poke" ${w?.poke ? "checked" : ""}></div>
  <div class="form-row"><label>事件标签</label><input type="text" id="w-etags" placeholder="跨平台语义标签，逗号分隔" value="${esc((w?.event_tags || []).join(", "))}"></div>
  <div class="form-row"><label>额外事件</label><input type="text" id="w-events" placeholder="事件类型（可写 qq.poke / qq.*），逗号分隔" value="${esc((w?.events || []).join(", "))}"></div>
  <div class="form-row"><label>关键词</label><input type="text" id="w-kw" placeholder="命中就醒，逗号分隔" value="${esc((w?.keywords || []).join(", "))}"></div>
  <div class="form-row"><label>无视这些人</label><input type="text" id="w-ign" placeholder="发送者 id，逗号分隔" value="${esc((w?.ignore_speakers || []).join(", "))}"></div>`;

function wakeOpsFromForm(session, room, connection) {
  const val = (id) => document.getElementById(id).value;
  const chk = (id) => document.getElementById(id).checked;
  const acc = val("w-acc").trim();
  return [{
    op: "subscription", session, connection, room,
    wake: {
      at_mention: chk("w-at"), reply: chk("w-reply"),
      name_mention: chk("w-nm"), names: csv(val("w-names")),
      accumulate: acc === "" ? null : Number(acc),
      poke: chk("w-poke"), event_tags: csv(val("w-etags")), events: csv(val("w-events")),
      keywords: csv(val("w-kw")), ignore_speakers: csv(val("w-ign")),
    },
  }];
}

function editWake(sessionId, subIndex) {
  const s = findSession(sessionId);
  const sub = s?.subscriptions?.[subIndex];
  if (!sub) return alert("找不到订阅（页面旧了？刷新一下）");
  formFrame(`唤醒策略 — ${esc(sessionId)} / ${esc(sub.room)}`, wakeFormHtml(sub.wake),
    () => submitPatch(wakeOpsFromForm(sessionId, sub.room)));
}

function addSub(sessionId) {
  const conns = (cfgCache?.connections || []).map((c) => c.id);
  formFrame(`新增订阅 — ${esc(sessionId)}`, `
    <div class="form-row"><label>连接</label><select id="s-conn">${conns.map((c) => `<option>${esc(c)}</option>`).join("")}</select></div>
    <div class="form-row"><label>房间路径</label><input type="text" id="s-room" placeholder="group/123456"><span class="hint">形如 group/群号、private/好友号</span></div>
    ${wakeFormHtml(null)}`,
    () => {
      const room = document.getElementById("s-room").value.trim();
      if (!room) { showFormError("房间路径不能为空"); return false; }
      if (room.includes(":")) { showFormError("只填路径（group/…），不要带连接名前缀"); return false; }
      submitPatch(wakeOpsFromForm(sessionId, room, document.getElementById("s-conn").value));
    });
}

function delSub(sessionId, subIndex) {
  const s = findSession(sessionId);
  const sub = s?.subscriptions?.[subIndex];
  if (!sub) return alert("找不到订阅（页面旧了？刷新一下）");
  if (!confirm(`删掉 ${sessionId} 对 ${sub.room} 的订阅？下一轮起这个房间的消息不再叫醒它。`)) return;
  submitPatch([{ op: "subscription", session: sessionId, room: sub.room, remove: true }]);
}

function editSession(sessionId) {
  const s = findSession(sessionId);
  if (!s) return alert("找不到会话");
  formFrame(`会话信息 — ${esc(sessionId)}`, `
    <div class="form-row"><label>显示名</label><input type="text" id="e-name" value="${esc(s.name || "")}"></div>
    <div class="form-row"><label>人格</label><select id="e-persona">${(cfgCache?.personas || []).map((p) => `<option ${p.id === s.persona ? "selected" : ""}>${esc(p.id)}</option>`).join("")}</select></div>
    <div class="form-row"><label>模型</label><input type="text" id="e-model" placeholder="留空 = harness 侧自定" value="${esc(s.model || "")}"></div>
    <div class="form-row"><label>记忆（逗号分隔）</label><input type="text" id="e-mems" value="${esc((s.memories || []).join(", "))}"></div>
    <p class="hint">接入令牌与 harness 绑定请走「编辑 TOML 原文」。</p>`,
    () => {
      const patch = { name: document.getElementById("e-name").value.trim(), persona: document.getElementById("e-persona").value };
      const model = document.getElementById("e-model").value.trim();
      patch.model = model === "" ? null : model;
      patch.memories = csv(document.getElementById("e-mems").value);
      submitPatch([{ op: "session", id: sessionId, patch }]);

}

function editPersona(id) {
  const p = findPersona(id);
  if (!p) return alert("找不到人格");
  formFrame(`人格 — ${esc(id)}`, `
    <div class="form-row"><label>名字</label><input type="text" id="p-name" value="${esc(p.name)}"></div>
    <div class="form-row"><label style="align-self:flex-start">人设文本</label><textarea id="p-text" style="width:100%;min-height:120px">${esc(p.text)}</textarea></div>`,
    () => submitPatch([{ op: "persona", id, name: document.getElementById("p-name").value.trim(), text: document.getElementById("p-text").value }]));
}

function editMemory(id) {

  if (!m) return alert("找不到记忆");
  formFrame(`记忆仓库 — ${esc(id)}`, `
    <div class="form-row"><label>名字</label><input type="text" id="m-name" value="${esc(m.name)}"></div>
    <div class="form-row"><label>类型</label><input type="text" id="m-kind" value="${esc(m.kind)}"><span class="hint">目前 git</span></div>

function editConnection(id) {
  const c = findConnection(id);
  if (!c) return alert("找不到连接");
  formFrame(`连接 — ${esc(id)} <span class="hint">（改了要重启桥）</span>`, `
    <div class="form-row"><label>地址</label><input type="text" id="c-url" value="${esc(c.url)}"></div>
    <div class="form-row"><label>账号</label><input type="text" id="c-account" value="${esc(c.account || "")}"></div>
    <div class="form-row"><label>密钥来源名</label><input type="text" id="c-secret" placeholder="留空不改；填单个 - 表示清除" style="max-width:320px"><span class="hint">名字在 [secrets] 里声明，这里不写密钥本身</span></div>`,
    () => {
      const patch = {};
      const url = document.getElementById("c-url").value.trim();
      const account = document.getElementById("c-account").value.trim();
      const secret = document.getElementById("c-secret").value;
      if (url && url !== c.url) patch.url = url;
      if (account && account !== c.account) patch.account = account;
      if (secret === "-") patch.secret = null;
      else if (secret.trim() !== "") patch.secret = secret.trim();
      if (!Object.keys(patch).length) { showFormError("没有改动"); return false; }
      submitPatch([{ op: "connection", id, patch }]);
    });
}

function editGlobals() {
  const c = cfgCache;
  formFrame("运行参数", `
    <div class="form-row"><label>单轮投递上限</label><input type="text" id="g-limit" value="${esc(c?.delivery_limit ?? "")}" style="max-width:96px"></div>
    <div class="form-row"><label>单轮自动超时</label><input type="text" id="g-timeout" value="${esc(c?.turn_timeout_secs ?? "")}" style="max-width:96px"><span class="hint">秒；0 = 关（跑多久都等）</span></div>
    <div class="form-row"><label>每房间留条数</label><input type="text" id="g-count" value="${esc(c?.retention?.max_records_per_room ?? "")}" style="max-width:96px"><span class="hint">0 = 不按条数清</span></div>
    <div class="form-row"><label>最多留天数</label><input type="text" id="g-days" value="${esc(c?.retention?.max_age_days ?? "")}" style="max-width:96px"><span class="hint">0 = 不按天数清</span></div>
    <div class="form-row"><label>默认失败通知</label><input type="text" id="g-err" value="${esc((c?.default_on_turn_error || []).join(", "))}" placeholder="log 或 send:qq:group/123，逗号分隔"><span class="hint">留空 = 只记日志</span></div>`,
    () => {
      const patch = {};
      const num = (id) => { const v = document.getElementById(id).value.trim(); return v === "" ? undefined : Number(v); };
      const limit = num("g-limit"), count = num("g-count"), days = num("g-days"), timeout = num("g-timeout");
      if (limit !== undefined) patch.delivery_limit = limit;
      if (timeout !== undefined) patch.turn_timeout_secs = timeout;
      if (count !== undefined) patch.max_records_per_room = count;
      if (days !== undefined) patch.max_age_days = days;
      patch.default_on_turn_error = csv(document.getElementById("g-err").value);
      submitPatch([{ op: "global", patch }]);
    });
}

function addConnection() {
  formFrame("新增连接 <span class='hint'>（保存后要重启桥才连上）</span>", `
    <div class="form-row"><label>连接 id</label><input type="text" id="nc-id" placeholder="qq2"></div>
    <div class="form-row"><label>平台</label><input type="text" id="nc-platform" value="qq"><span class="hint">平台标识（连接名参与房间路由）</span></div>
    <div class="form-row"><label>适配器</label><input type="text" id="nc-kind" value="onebot11"></div>
    <div class="form-row"><label>地址</label><input type="text" id="nc-url" placeholder="ws://127.0.0.1:53001/ws" style="max-width:340px"></div>
    <div class="form-row"><label>账号</label><input type="text" id="nc-account" placeholder="机器人 QQ 号"></div>
    <div class="form-row"><label>密钥来源名</label><input type="text" id="nc-secret" placeholder="可选；先在 [secrets] 里声明的名字"></div>`,
    () => {
      const g = (id) => document.getElementById(id).value.trim();
      const id = g("nc-id");
      if (!id) { showFormError("连接 id 不能为空"); return false; }
      if (!g("nc-url") || !g("nc-account")) { showFormError("地址和账号都得填"); return false; }
      const create = {
        platform: g("nc-platform"), kind: g("nc-kind"),
        url: g("nc-url"), account: g("nc-account"),
      };
      if (g("nc-secret")) create.secret = g("nc-secret");
      return submitPatch([{ op: "connection", id, create }]);
    });
}

function addSession() {
  const harnesses = (cfgCache?.harnesses || []);
  if (!harnesses.length) { alert("配置里还没有任何 harness，先用「编辑 TOML 原文」加 [[harnesses]]"); return; }
  const personas = (cfgCache?.personas || []);
  formFrame("新增 harness 会话", `
    <div class="form-row"><label>会话 id</label><input type="text" id="ns-id" placeholder="dsh-group3"></div>
    <div class="form-row"><label>harness</label><select id="ns-harness">${harnesses.map((h) => `<option>${esc(h.id)}</option>`).join("")}</select></div>
    <div class="form-row"><label>人格</label><select id="ns-persona">${personas.map((p) => `<option>${esc(p.id)}</option>`).join("")}</select><span class="hint">必填；没有就先去建一个</span></div>
    <div class="form-row"><label>显示名</label><input type="text" id="ns-name" placeholder="可选"></div>
    <div class="form-row"><label>密钥来源名</label><input type="text" id="ns-secret" placeholder="例如 dsh-dev-token" style="max-width:340px"><span class="hint">名字在 [secrets] 里声明；harness 连桥用，驱动要重启才能拿到值</span></div>
    <p class="hint">建好后去「订阅」给它加房间；驱动侧要在 start-drivers.sh 里登记这个会话 id 才会被驱动。</p>`,
    () => {
      const g = (id) => document.getElementById(id).value.trim();
      const id = g("ns-id");
      if (!id) { showFormError("会话 id 不能为空"); return false; }
      const create = {
        harness: document.getElementById("ns-harness").value,
        secret: g("ns-secret"),
      };
      if (!create.secret) { showFormError("密钥来源名不能为空"); return false; }
      create.persona = document.getElementById("ns-persona").value;
      if (!create.persona) { showFormError("人格必填（配置里 persona 是必填项）"); return false; }
      if (g("ns-name")) create.name = g("ns-name");
      return submitPatch([{ op: "session", id, create }]);
    });
}

async function boot() {
  const switcher = $("#locale");
  if (switcher) switcher.addEventListener("change", (e) => switchLocale(e.target.value).catch((err) => console.error(err)));
  await loadI18n();
  document.querySelectorAll("nav button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b === btn));
      document.querySelectorAll("main section").forEach((sec) => sec.classList.toggle("active", sec.id === "tab-" + btn.dataset.tab));
      tabs[btn.dataset.tab]().catch((e) => console.error(e));
    });
  });
  $("#logout").addEventListener("click", () => { store.del("acb-console-token"); location.href = "/?login=1"; });
  loadStatus().catch((e) => console.error(e));
}
boot().catch((e) => console.error(e));
