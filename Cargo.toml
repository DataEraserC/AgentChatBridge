[workspace]
resolver = "3"
members = [
    "crates/i18n",
    "crates/proto",
    "crates/adapter-api",
    "crates/kernel",
    "crates/adapters/onebot-snowluma",
    "crates/adapters/process",
    "crates/adapters/dynamic",
    "crates/adapters/dynamic-fixture",
    "crates/plugins/trusted",
    "crates/plugins/lua",
    "crates/plugins/process-tools",
    "crates/plugins/process-provider",
    "crates/plugins/wake-fixture",
    "crates/wasm-host",
    "crates/notifier-process",
    "crates/extensions",
    "crates/supervisor-policy",
    "crates/supervisor",
    "crates/launcher",
    "crates/memory-steward",
    "crates/bridge",
]

# 参考 .so 只作为 conformance fixture 构建；默认 workspace 不编译它们。
exclude = [
    "crates/fixtures/access-so",
    "crates/fixtures/access-so-bad-abi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
acb-i18n = { path = "crates/i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
