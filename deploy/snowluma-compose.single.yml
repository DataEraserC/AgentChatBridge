# SnowLuma 单账号 compose —— ACB 依赖的协议端容器。
#
# 权威副本在 ACB 仓库（本文件）。~/Documents/SnowLuma/ 下的同名文件是指向这里的
# 软链接，两边永远同一份内容，不存在漂移。
#
# ── 命令（旧命令已废弃）──────────────────────────────────────────────────
#   废弃：podman-compose -f ~/Documents/SnowLuma/docker-compose.yml down/up -d
#   现在：
#     podman-compose -f ~/Documents/code/AgentChatBridge/deploy/snowluma-compose.single.yml down
#     podman-compose -f ~/Documents/code/AgentChatBridge/deploy/snowluma-compose.single.yml up -d
#
#   多账号版见同目录 snowluma-compose.multi.yml。两者容器名与三个登录态卷相同，
#   是「同一套栈的两种形态」，切换时 down 旧的再 up 新的即可，登录态不丢。
#   ⚠️ 不要同时 up 两份 —— 同名容器与同宿主端口会冲突。
#
# ── 环境变量从哪来 ──────────────────────────────────────────────────────
#   env 真值：deploy/snowluma.env（.gitignore 忽略，含 VNC_PASSWD，权限 600）
#   env 模板：deploy/snowluma.env.example（入库，只有占位符）
#   首次部署：cp deploy/snowluma.env.example deploy/snowluma.env && chmod 600 …
#   ~/Documents/SnowLuma/.env 现在是指向真值的软链接，两处同一份内容。
#
#   podman-compose 默认只读「compose 同目录的 .env」这个文件名，
#   而真值叫 snowluma.env，因此必须显式指定 env 文件：
#     podman-compose --env-file deploy/snowluma.env -f <本文件> up -d
#   为免每次手打，用同目录的 snowluma.sh 包装脚本（已内置该参数）。
#
# ── 现网事实（2026-11-19 实测 ss -ltnp，不是推断）────────────────────────
#   容器正在监听 53000(HTTP) 53001(WS) 56081(noVNC) 55099(WebUI)。
#   这些值来自 deploy/snowluma.env；下面的 3000/3001/6081/5099 是
#   容器内端口与 fallback 默认值，不是宿主端口。
#   ACB 侧 ~/.local/share/acb/config/config.active.toml 抬头写明
#   「OneBot：snowluma 容器，53001 = WS，53000 = HTTP」。
#   → 改这四个端口就会切断 ACB，不要动。
#
# ── 文件中继（ADR-0025）────────────────────────────────────────────────
#   桥在宿主监听 0.0.0.0:3131，容器内用 http://host.containers.internal:3131
#   即可到宿主（实测：10.89.0.1 网关与局域网 IP 都不通，host.containers.internal 通）。
#   本 compose 无需为中继做任何改动。
services:
  snowluma:
    image: ${SNOWLUMA_IMAGE:-motricseven7/snowluma:latest}
    container_name: ${SNOWLUMA_CONTAINER:-snowluma}
    restart: unless-stopped
    shm_size: 1gb
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      VNC_PASSWD: ${VNC_PASSWD:-}
      SNOWLUMA_UID: ${SNOWLUMA_UID:-1000}
      SNOWLUMA_GID: ${SNOWLUMA_GID:-1000}
      SNOWLUMA_WEBUI_HOST: ${SNOWLUMA_WEBUI_HOST:-0.0.0.0}
      SNOWLUMA_WEBUI_PORT: ${SNOWLUMA_WEBUI_PORT:-5099}
      SNOWLUMA_LOG_LEVEL: ${SNOWLUMA_LOG_LEVEL:-info}
      SNOWLUMA_SCREEN: ${SNOWLUMA_SCREEN:-1920x1080x24}
      SNOWLUMA_HOOK_AUTOLOAD: ${SNOWLUMA_HOOK_AUTOLOAD:-1}
      SNOWLUMA_EXTRA_QQ_HOMES: "${SNOWLUMA_EXTRA_QQ_HOMES:-}"
      SNOWLUMA_QQ_FLAGS: "${SNOWLUMA_QQ_FLAGS:---disable-gpu --disable-software-rasterizer --disable-gpu-compositing}"
    ports:
      - "${NOVNC_PORT:-6081}:6081"
      - "${SNOWLUMA_WEBUI_HOST_PORT:-5099}:${SNOWLUMA_WEBUI_PORT:-5099}"
      - "${ONEBOT_HTTP_PORT:-3000}:3000"
      - "${ONEBOT_WS_PORT:-3001}:3001"
    volumes:
      - qq-gateway-data:/app/data
      - qq-client-config:/app/.config
      - qq-client-data:/app/.local/share

volumes:
  qq-gateway-data:
    name: qq-gateway-data
  qq-client-config:
    name: qq-client-config
  qq-client-data:
    name: qq-client-data