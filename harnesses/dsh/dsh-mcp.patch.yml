# 占位文件，故意为空。
#
# 为什么还留着一个空文件：payload 契约要求它存在——`crates/acb/src/profile.rs`
# 的固定必带项和 `deploy/acb-contract.json` 的 layout 都列了它。删文件会让
# `profile add` / 升级直接报 `payload_missing_path`；要真正删掉得升 contract
# 版本，而当前 acbl 只支持 contract 1。
#
# 为什么是空的：provider、默认模型、agent preset 属于**使用者自己的部署配置**，
# 不该由这个仓库替用户决定。用户把需要的行写进自己的 dsh patch：
#   - 运行时以 unit 的 ACB_DSH_PATCH 为准（本机指向 $DSH_HOME/cordis.patch.yml）；
#   - 可抄的示例见同目录 `dsh-mcp.example.yml`。
#
# 空 patch 是合法的，dsh 会用它自带/用户 profile 里的配置。
