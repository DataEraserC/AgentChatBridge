# 桥这一侧的配置片段：一个 harness + 一个会话。
# 完整可运行配置见仓库根的 config.example.toml；这里只列 LobsterAI 相关的部分。
#
# GUI 侧不要直接启动 app：用 `multi-instance lobsterai 1`，首次为空 profile，
# 要在实例里重新登录并等它生成 openclaw/state。
# driver 侧 ACB_LA_STATE_DIR 必须是 ~/.config/LobsterAI/openclaw/state（或该实例里
# 等价的 openclaw/state），ACB_MCP_PORT=7717，不能指 ~/.openclaw。
# 当前 LobsterAI 待登录后启用；CodeBuddy 走通用 ACP（见 harnesses/acp/agents.example.json）。

[[harnesses]]
id = "lobsterai"
# 名字只是给人看的；连接时 harness 报的是 id + token。
name = "LobsterAI"

[[sessions]]
id = "lobster-main"
harness = "lobsterai"
# 接入令牌：和适配器进程的 ACB_TOKEN 一致。
token = "换成你自己的一长串随机字符"
# 人格卡 id 必须指向文件里已定义的人格。
persona = "main"

# 订阅的房间按你的平台配置填；下面只是形状示例。
[[sessions.subscriptions]]
connection = "qq"
path = ["group", "123456789"]
