# 桥这一侧的配置片段：当前把 LobsterAI 的槽位临时用 workbuddy-1 顶上。
# 完整可运行配置见仓库根的 config.example.toml；这里只列相关部分。
#
# GUI 侧不要直接启动 app：WorkBuddy 用 `multi-instance workbuddy 1`（第二实例
# 用 `multi-instance workbuddy 2`），首次为空 profile，要在实例里重新登录。
# 切换 LobsterAI 时 GUI 用 `multi-instance lobsterai 1`。

[[harnesses]]
id = "workbuddy-1"
name = "WorkBuddy instance 1"

# 可选：第二实例。两个实例各自独立登录、state、MCP 端口和会话 id 前缀。
[[harnesses]]
id = "workbuddy-2"
name = "WorkBuddy instance 2"

# 切回 LobsterAI 时启用这个 harness；适配器代码不用改。
# [[harnesses]]
# id = "lobsterai"
# name = "LobsterAI"

[[sessions]]
# 沿用 LobsterAI 那个槽位的会话 id，切换只发生在 harness 字段。
id = "lobster-main"
harness = "workbuddy-1"
# 接入令牌：和适配器进程的 ACB_TOKEN 一致。
token = "换成你自己的一长串随机字符"
# 人格卡 id 必须指向文件里已定义的人格。
persona = "main"

# 订阅的房间按你的平台配置填；下面只是形状示例。
[[sessions.subscriptions]]
connection = "qq"
path = ["group", "123456789"]

# 可选：第二实例的会话。不要和上面订阅同一个房间，否则两个实例会重复回复。
# [[sessions]]
# id = "workbuddy-2-main"
# harness = "workbuddy-2"
# token = "同一个令牌也可以"
# persona = "main"
# [[sessions.subscriptions]]
# connection = "qq"
# path = ["group", "987654321"]

# 切回 LobsterAI：
#   1. 把上面 [[sessions]] 的 harness 改成 "lobsterai"；
#   2. GUI 侧用 `multi-instance lobsterai 1` 启动并在实例里登录；等它生成
#      openclaw/state 后，再启动 LobsterAI 驱动器（ACB_TOKEN 不变，
#      ACB_LA_STATE_DIR 指回 ~/.config/LobsterAI/openclaw/state 或该实例里
#      等价的 openclaw/state，ACB_MCP_PORT=7717，不能指 ~/.openclaw）；
#   3. 不需要改代码。ACB 会话 id / 订阅 / 水位保留，harness 侧会话映射
#      由新 driver 重新 report_map；旧 WorkBuddy 的 -r 映射不再使用。
