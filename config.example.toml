# 桥的示例配置。
# 注意：业务对象（连接/人格/记忆/harness/会话/权限）自 schema 15 起以数据库为唯一来源；
# 这份文件只描述形状，照抄不会生效。真机运行配置只保留启动必需段。
#
# 字段语义见 docs/adr/0017-multi-agent-model.md 与 docs/adr/0002-subscription-model.md。
#
# 五个一等对象，从下往上（ADR-0017）：
#   连接   = 一条通到平台的管道（适配器 + 连接方式 + 地址 + 登录账号）。一个账号一条，
#            同一个平台可以有多条——两个 QQ 号就是两条连接。
#   人格   = 一张纯文本人设卡（id + name + text）。只管「是谁、什么语气、什么不能漏」，
#            不带记忆、不带订阅、不声明能力。
#   记忆   = 一份长期知识，抽象接口（id + name + kind + location）。kind 目前只有 git。
#   harness = 一个接管者（id + name）。桥不主动连它，是它反过来连桥报名字 + 令牌。
#   会话   = 一个串行单元（id + name 可空 + harness id + 人格 id + 记忆 ids 可空 +
#            model 可空 + 订阅）。串行键 = harness id + 会话 id。
#   订阅   = 连接 + 房间 + 唤醒策略。
#
# 房间写法是「连接名:段/段」。QQ 的群要写成 group/<群号>、私聊写成 private/<号码>，
# 所以「连接 qq 上那个群 123」要写成 qq:group/123。
# 第一段是**连接名**不是平台名：同一个号看同一个群只算一个房间，两个号看同一个群是两个。
#
# 令牌 + harness id 是 harness 连进来时报的身份：名字对上、令牌对上，那条连接就代表
# 这个 harness 接管的那组会话。别把示例里的令牌直接用在真环境里。
#
# 运行期策略也可以放分片：base 同目录的 config.d/*.toml 会按文件名字典序合并
# （数组追加、标量/表后覆盖、带 key 的表按键覆盖）；控制台保存写到
# config.d/90-console.toml。详见 docs/guide/config.md「配置分片」。

# 密钥来源（ADR 待编号）：配置里只写来源名，不写密钥本体。
# 桥自己消费的密钥（控制台 / 连接 / 会话接入 / 通知）都走这里；dsh/opencode 的 API key
# 仍由各自的环境或 EnvironmentFile 提供。读不到值会启动失败（退出码 78）。
[secrets]
# 不写 kind 的来源默认用这个。
default_kind = "env"

[[secrets.sources]]
name = "console-token"
variable = "ACB_CONSOLE_TOKEN"

[[secrets.sources]]
name = "qq-token"
variable = "ACB_SNOWLUMA_TOKEN"

[[secrets.sources]]
name = "qq2-token"
variable = "ACB_SNOWLUMA_TOKEN_2"

[[secrets.sources]]
name = "main-session-token"
variable = "ACB_DSH_DEV_TOKEN"

# 也可以读独立文件（path 必须是绝对路径）。format 缺省是 raw：整个文件就是一个值。
# [[secrets.sources]]
# name = "ntfy-topic"
# kind = "file"
# path = "/run/agenix/ntfy-acb-topic.env"
# format = "dotenv"
# key = "NTFY_ACB_TOPIC"

[endpoint]
# harness 连这个地址。默认只听本机，外网连不上。
listen = "127.0.0.1:7700"

# 桥侧统一控制台（ADR-0018）：一个 HTTP 服务，能读会话/映射状态、重置会话。
# 可选，不配就不起。可远程访问，所以 token 必填、必须认真校验。
# 请求都要带 `Authorization: Bearer <token>`。
# 端点：GET /api/status、GET /api/sessions、POST /api/session/:id/reset、GET /
# 要启用就把下面三行取消注释：
# [console]
# listen = "127.0.0.1:3100"
# token = { secret = "console-token" }

# 文件中继（ADR-0025）：agent 和平台不共用文件系统时，桥把本机文件收下来，
# 换成平台能下载的 URL。不配就不起文件服务，本机路径原样透传。
# public_base 必须是**平台那边**能访问到桥的地址（平台在容器里时通常写宿主网关）。
# [file_relay]
# mode = "file-server"                     # 目前只有这一种
# listen = "0.0.0.0:3131"
# public_base = "http://host.containers.internal:3131"
# dir = "state/relay"                      # 不写就用 state/relay
# max_publish_bytes = "4 GiB"              # 单个文件上限，默认 4 GiB；写整数即字节数
#                                          # 也认 "4096 MiB" / "1.5 GiB" / "1500 MB"
#                                          # 每次发布整份复制到 dir 并保留 24 小时，
#                                          # 并发发大文件时磁盘峰值 = 并发数 × 上限

# 动态库插件（ADR-0026 / 0027）：一个 .so/.dylib 可以是平台适配器，也可以是策略 provider。
# 插件自己的 manifest 决定它是哪一种；这里的 kind 只用于校验适配器。
# [[plugins]]
# path = "/绝对路径/libdemo_adapter.so"
# kind = "demo"                            # 可选；必须和 manifest 的 kind 一致
#
# [[plugins]]
# path = "/绝对路径/libacb_example_wake.so"   # 策略 provider 不写 kind
#
# Lua 脚本不写在这里：把 ACB_LUA_DIR 指向脚本目录，文件名就是 provider 名（lua.<文件名>）。

# ---------------------------------------------------------------------------
# 顶层参数（不属于任何表，必须写在第一个表头之前）
# ---------------------------------------------------------------------------
# worktree 根目录：每个「会话 × 记忆」的 worktree 都 checkout 到这里，
# 按「根/记忆id/会话id」分层。不配就用 state/worktrees。
# 桥只负责第一次把 worktree 建出来，之后文件读写和 git 操作全交给 harness。
worktrees_root = "state/worktrees"

# 一轮投递最多塞多少条新记录。默认 30；0 = 不截断。
# 超过上限时从最旧开始连续投一段，剩余的下一轮接着投；水位每轮都能前进。
delivery_limit = 30

# 一轮失败后的全局默认通知动作：log / send:<房间>。会话自己的 on_turn_error 优先。
# 空 = 只记日志。
default_on_turn_error = []

# 一轮最多跑多久（秒）。不配 = 默认关闭（跑多久都等）。
#   0 = 关闭超时：模型想跑多久跑多久，桥不掐、harness 也不许自己掐。
#   n > 0 = 到点还没结束，harness 主动打断本侧会话（dsh 有队列能打断；不支持
#   打断的 harness 按各自兜底）。打断算这轮失败，走 on_turn_error 通知。
turn_timeout_secs = 0

[storage]
# 状态库：流水、水位、笔记、「第几次投递」都在这一个 SQLite 文件里。
# 不配就用 state/acb.db（相对启动时的工作目录）。目录不存在会自动建。
# 备份就是拷这个文件；删了等于失忆，但桥不会因此起不来。
path = "state/acb.db"

[retention]
# 旧流水什么时候可以删。只削**已经读过**的那一段：任何在册会话还没读到的记录，
# 一条都不删。两项写 0 就是不作任何清理（库只增不减）。
# 每 5 分钟扫一次，删了什么会打一行「清理：… 删掉 N 条已读记录」。
max_records_per_room = 5000
max_age_days = 90

# 后台任务（可选）。发送类工具/平台调用可以 async=true 后台执行，结果落 tasks 表。
[tasks]
# 后台任务收工后是否叫醒发起它的会话。默认关闭：关闭时行为与以前完全一致。
# 只叫醒发起者；该会话已有在跑的轮次时，结果并入下一轮，不抢断当前轮。
wake_on_completion = false

# tasks op=wait 的服务端上限（毫秒），默认 45000（45 秒）。
# 调用方可以给更小的 wait_ms；给大了会被截断到上限，并在返回里注明。
# 刻意低于 opencode 的单次工具调用硬超时（60 秒）；dsh 没有工具级死线。
wait_max_ms = 45000

# 外置进程策略 provider（最小面：access）。core 不认识 wasm，只按 command 启动宿主。
# 列表为空 = 不启动任何宿主；配置里有但宿主起不来 = 启动期硬失败（退出 78）。
# [[process_providers]]
# id = "demo.wasm_access"
# extension = "access"
# command = ["/绝对路径/acb-wasm-host", "--module", "/绝对路径/access.wasm", "--provider", "demo.wasm_access"]
# startup_timeout_secs = 10
# timeout_ms = 5000
# env = { RUST_BACKTRACE = "0" }        # 可选
# cwd = "/绝对路径"                      # 可选
#
# 会话用 [sessions].access.provider = "demo.wasm_access" 引用它。

# 记忆管家：后台把「会话 × 记忆」的 worktree 推到远端、把远端提交合回来。
# 不写在 core 的轮次路径里；失败/冲突只记状态并通知会话，不挡对话。
# enabled = false（默认）时不起线程。
# [memory_steward]
# enabled = true
# interval_secs = 300       # 时间触发；0 = 关闭（与 commit_threshold 至少开一个）
# commit_threshold = 5      # 本地新增提交数触发；0 = 关闭
# poll_secs = 30            # 后台检查间隔，不是同步周期
# merge_strategy = "merge"  # merge | rebase
# auto_resolve = "none"     # none（默认：冲突停下并列文件）；local / remote 会丢弃另一侧
# state_dir = "state/memory-steward"   # 合并演练写在 state_dir/memory-merge/ 下
# git_timeout_secs = 120

# ---------------------------------------------------------------------------
# 连接
# ---------------------------------------------------------------------------
# kind 说用哪个适配器（目前支持 onebot11；onebot-snowluma 是等价别名），transport 说连接方向：
#   ws-client = 桥主动去连平台开出来的 WS 服务端（NapCat / Lagrange 等）
#   ws-server = 桥当服务端，等平台连过来（还没实现）
# account 是这条连接登录的号：桥靠它认出「这句是我自己说的」。
# 连上之后会跟平台报的号核对一次，对不上会警告。

[[connections]]
id = "qq"
platform = "qq"
kind = "onebot11"
transport = "ws-client"
url = "ws://127.0.0.1:3001"
token = { secret = "qq-token" }
account = "10001"
admin_qqs = []   # 这些 QQ 号会被标成系统管理员（记录里的 sender.role = system_admin）
# SnowLuma 兼容下限（默认 2.4.0）；低于下限只在启动日志告警，不断连。
# options = { snowluma_min_version = "2.4.0" }
#
# 异步路径的上传时限（毫秒）。同步路径仍用 45 秒（要留在 harness 的 60 秒工具超时内）；
# 异步调用提前返回 task_id，不受那条死线约束，所以给大文件留足时间。默认 300000（300 秒），
# 约覆盖 5 Mbps 上行的 161 MB。带宽参考：161 MB 在 10 Mbps ≈ 129s、20 Mbps ≈ 64s、40 Mbps ≈ 32s。
# options = { async_upload_timeout_ms = 300000 }
#
# 可选 HTTP 事件上报（SnowLuma 的 httpClients）：桥额外监听一个 HTTP 端点接收事件，
# 动作仍走上面的 WS。token 同时是 HMAC-SHA1 密钥；SnowLuma 侧 accessToken 必须一致。
# 请求必须带 X-Signature: sha1=<HMAC-SHA1(token, 原始 body)>，否则 401。
# options = { http_listen = "0.0.0.0:3002" }
#
# wss:// 部署前提：适配器只接受 ws://。需要 TLS 时用反向代理（nginx/stunnel）终止
# TLS，再把 ws:// 转发到桥监听的地址；SnowLuma 的 wsServers 本身不提供 TLS。

# 反向 WS：让 SnowLuma 主动连桥（SnowLuma 的 wsClients）。桥监听 options.listen；
# token 与 SnowLuma 那边配的 accessToken 一致，支持 ?access_token= 或 Bearer。
# [[connections]]
# id = "qq-reverse"
# platform = "qq"
# kind = "onebot11"
# transport = "ws-server"
# options = { listen = "0.0.0.0:3001" }
# token = { secret = "qq-reverse-token" }
# account = "10001"

# 入站策略（ADR-0026）：决定这条连接上的记录收不收。默认全部接收。
# 被丢掉的记录不写流水、不叫醒任何人，就像从没到过桥。
# [connections.receive]
# provider = "acb.receive.all"

# 消息路由（ADR-0028）：入库前把命令/链接交给插件。按顺序执行，pass 才轮到下一个。
# 下面三条需要 ACB_LUA_DIR 指向 examples/lua（或在部署层另外挂载）。
# [[connections.routes]]
# provider = "lua.stop_command"
# [connections.routes.options]
# commands = ["/stop"]
# scope = "room"
# admin_only = true
#
# [[connections.routes]]
# provider = "lua.send_command"
#
# [[connections.routes]]
# provider = "lua.b23_video"
# [connections.routes.options]
# dir = "/tmp/acb-b23"
# timeout_ms = 600000

# 同一个平台的第二个号：id 换个名字就行。它看到的群是 qq2:group/123，
# 跟 qq:group/123 是两个房间，各记各的水位，永远不会重复收。
[[connections]]
id = "qq2"
platform = "qq"
kind = "onebot11"
transport = "ws-client"
url = "ws://127.0.0.1:3002"
token = { secret = "qq2-token" }
account = "10002"

# ---------------------------------------------------------------------------
# 人格
# ---------------------------------------------------------------------------
# 一张卡一份。text 是投递给模型的人设正文。能力（能不能 bash/git/用工具）不写在这里，
# 由会话配置与 harness/适配器决定。

[[personas]]
id = "default"
name = "默认人格"
text = """
你是谁、什么性格、什么语气，写在这里。
只写「怎么说话」和「信息边界」（什么不能说、什么不能漏），
不要写「你没有本地工具」这类能力声明——能力由会话配置和 harness 决定。
"""

# ---------------------------------------------------------------------------
# 记忆
# ---------------------------------------------------------------------------
# 一份记忆一个 id。kind 目前只有 git，location 是仓库路径。
# 桥只负责初始化 worktree 并告诉 harness「当前会话的 worktree 路径」，
# 文件读写和 git 操作全部由 harness 直接做（桥不做提交/推送/建分支/改内容）。

[[memories]]
id = "main-memory"
name = "主记忆"
kind = "git"
location = "/home/you/qqab-memories/main"

# ---------------------------------------------------------------------------
# harness
# ---------------------------------------------------------------------------
# 一个 harness = 一个接管者（id + name）。桥不主动连它——是它反过来连桥、报出名字
# + 令牌。桥只存「有哪些 harness」用来校验会话的引用，不存它的连接地址或内部配置。
# 会话里的 harness 字段必须指向这里定义过的某个 id。

[[harnesses]]
id = "opencode"
name = "OpenCode"

[[harnesses]]
id = "dsh"
name = "DeepSeek"

# ---------------------------------------------------------------------------
# 会话
# ---------------------------------------------------------------------------
# 一个会话 = 一个串行单元。harness id + 会话 id 是它的串行键。
# name 可空（缺省 = id）；memories 可空（空 = 不存长期记忆）；
# model 可空（空 = 由 harness 侧自己决定用哪个模型）；persona 必须指向上面定义的人格卡。

[[sessions]]
id = "main"
harness = "dsh"
name = "QQ 主群助手"
persona = "default"
memories = ["main-memory"]
# model 这个会话要用哪个模型。留空 = 由 harness 侧决定（dsh 改 profile、opencode 改 config）。
model = "deepseek-chat"
# 接入令牌：harness 连进来时报出 harness id + 这个令牌，桥据此绑定会话。
token = { secret = "main-session-token" }

# 这个会话一轮失败后的通知动作（log / send:<房间>）。空 = 只记日志，
# 回退到全局 default_on_turn_error。
on_turn_error = []

# 访问策略（可选）：默认由内置 [grants] 评估器判定；只有接入外部 access provider
# 时才需要写这个表。
# 旧的三把钥匙 all_rooms / elevated_in_rooms / privileged_origins 已移除：
# 配置里再出现会直接启动失败，请改用下面的 [grants] 规则。
# [sessions.access]
# provider = "vendor.access"

# 投递批次选择（ADR-0026 Phase 4）。不写就是内置「从旧到新连续投一段」。
# [sessions.delivery]
# provider = "acb.delivery.default"

# 发送前/后钩子（ADR-0026 Phase 4）。before 可以改写正文，after 只观察回执。
# 列表里写 provider id，由已安装的 manager 提供；不写 = 不挂钩子。
# [sessions.outbound]
# before = []
# after = []

# 失败通知策略（ADR-0026）。不写就是内置：会话 on_turn_error 非空就用它，
# 否则回退全局 default_on_turn_error。
# [sessions.turn_error]
# provider = "acb.turn_error.default"
# 插件专属参数；core 不解释，原样交给 provider。
# [sessions.turn_error.options]
# only = "log"

# QQ 群：@ 我、引用我的话、叫我名字、攒够 5 条就醒；被拍也醒。
[[sessions.subscriptions]]
connection = "qq"
room = "group/123456789"

# 投递窗口：唤醒时正文带多少条、时钟唤醒投多少条。不写就是 3/3/3。
# 只影响正文，未读永远以完整编号区间下发。会话级也能写，订阅逐项覆盖。
# context_before = 3   # 触发消息之前带几条（可能已经读过）
# context_after = 3    # 触发消息之后带几条
# batch_head = 3       # 时钟/攒批唤醒投最旧的几条

[sessions.subscriptions.wake]
provider = "acb.wake.default"  # 唤醒策略实现（ADR-0026）；不写就是内置
at_mention = true
reply = true          # 引用我发的某条消息也算对我说话（QQ 的「回复」就是这种）
name_mention = true
names = ["小助手"]
accumulate = 5
poke = true           # 旧语法糖：默认「冲我来的事件」就醒，true 等同不配
# event_tags = ["poke"]                    # 跨平台语义标签：换个平台只要标签一样也生效
# events = ["qq.group_increase", "qq.*"]   # 点名平台事件；带前缀必须属于这个 QQ 房间

# 时钟策略（ADR-0011）：没有新消息也定期开一轮例行检查。默认关闭。
# 写了 interval_secs / idle_secs 但没写 provider 时，自动用内置时钟。
# [sessions.subscriptions.clock]
# interval_secs = 1800   # 每 30 分钟一次
# idle_secs = 7200       # 或房间安静满 2 小时

# 第二个号的私聊：只在 @ 我或回复我时醒；那个人说话不叫醒（但照常记录）。
[[sessions.subscriptions]]
connection = "qq2"
room = "private/987654321"

[sessions.subscriptions.wake]
at_mention = true
reply = true
name_mention = false
accumulate = 20
poke = false          # 旧语法糖，等价于 ignore_event_tags = ["poke"]：私聊里被拍不醒
ignore_speakers = ["987654321"]

# 一次性票据的申请冷却与审批聚合（可选，不写用默认值）。
# request_cooldown_secs：同一会话两次审批私信之间的最小间隔（秒）。
# admin_cooldown_secs：同一个 system admin 收到两条审批私信的最小间隔（秒）。
# auto_expire：审批等待超时后自动置 Expired（终态，区别于「有人拒绝」的 Denied），
#              并把结果写回申请房间；按批次聚合唤醒会话。
# pending_ttl_secs：pending 票据的等待上限（秒）；0 = 不做 pending 过期。
# 0 = 关闭对应冷却；同一轮里的多张 pending 仍会聚合成一条私信。
# [tickets]
# request_cooldown_secs = 60
# admin_cooldown_secs = 30
# auto_expire = true
# pending_ttl_secs = 600

# 访问授权（可选）。不写 [grants] = 只有订阅边界。
# 规则是叠加在订阅边界之上的常态授予；风险等级不参与鉴权：
# destructive / critical 默认没有授予 → 走票据 + 审批；规则显式授予对应 capability 才直调。
# 注意：规则命中但没列该 capability 时按 deny 处理（fail closed）。
#
# 典型写法 1：订阅内读写（把规则钉在已订阅目标上）
# [[grants.rules]]
# subject = "user"
# place = "group"
# scope = "subscribed"
# capability = ["room_read", "room_write", "connection_read"]
#
# 典型写法 2：私信管理员（账号在私信里可以任意目标，群里不自动提权）
# [grants.bot_admin]
# accounts = [{ connection = "qq", account = "10001" }]
#
# [[grants.rules]]
# subject = "bot_admin"
# place = "private"
# scope = "subscribed"
# capability = ["room_read", "room_write", "connection_read", "plugin"]
#
# 典型写法 3：系统管理员（私信/控制台常驻，群内同账号不提权）
# [grants.system_admin]
# connection = "qq"
# account = "10002"
#
# [[grants.rules]]
# subject = "system_admin"
# place = "private"
# scope = "subscribed"
# capability = ["room_read", "room_write", "connection_read"]
#
# 典型写法 4：显式允许破坏性/高危平台方法（强烈不建议给 critical）
# [[grants.rules]]
# subject = "user"
# place = "group"
# scope = "connection"
# target = { kind = "connection", id = "qq" }
# capability = ["room_write", "platform", "destructive"]   # 该连接所有 destructive 方法直调
#
# 只放行单条方法：scope = "platform_op"，target 指到方法名。
# [[grants.rules]]
# subject = "user"
# place = "group"
# scope = "platform_op"
# target = { kind = "platform_op", id = "group.mute", sub = "qq" }
# capability = ["room_write", "platform", "destructive"]
#
# 能力：room_read / room_write / connection_read / platform / destructive /
#       critical / access_request / account_read / plugin。
# account_secret 不能常驻授予，只能走 access_request 票据。
# critical 可以被规则显式授予（写了就直调），但强烈不建议。
# 场所：private / group / console / none；范围：subscribed / room / connection / platform_op。
#
# scope = "room" / "connection" / "platform_op" 时必须给 typed target：
#   target = { kind = "room", id = "qq:group/123" }
#   target = { kind = "connection", id = "qq" }
#   target = { kind = "platform_op", id = "group.mute", sub = "qq" }
# 旧写法 target = "qq:group/123" 会在启动解析期直接报错，不留兼容层。
# 旧键 allow_destructive（true / false / 方法名数组）与 [connections.policy.risk] 均已移除：
# 出现即启动失败，报错会给出可直接抄的 [[grants.rules]] 写法。
# scope = "subscribed" 只覆盖本会话可达的 kind/目标，不是无条件全开。
# access_request 默认：群友只能申请本会话已订阅目标；system_admin / bot_admin 在私信
# 或控制台可申请任意目标；跨目标要显式规则（scope = "room" / "connection" + typed target）。
# 未知字段或未知枚举会在启动解析期报错，不会静默忽略。
